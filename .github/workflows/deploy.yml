name: deploy

# 전역 환경변수
env:
  IMAGE_REPOSITORY: mori-mori # GHCR에 저장할 이미지 리포지토리명(소유자 포함 X)
  CONTAINER_1_NAME: mori-mori_1 # 컨테이너 슬롯1
  CONTAINER_2_NAME: mori-mori_2 # 컨테이너 슬롯2
  CONTAINER_PORT: 8080 # 스프링부트 애플리케이션이 컨테이너 내부에서 사용하는 포트
  EC2_INSTANCE_TAG_NAME: morimori-ec2 # 배포할 EC2 인스턴스의 Name 태그
  DOCKER_NETWORK: common # 서비스들이 통신할 도커 네트워크 이름
  BACKEND_DIR: . # Dockerfile 위치

# 동시성 처리 끔
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # 짧은 시간안에 커밋이 몰리면 마지막 커밋에 대해서만 액션이 수행되도록
  cancel-in-progress: false # 기존에 시작된 작업은 새 커밋이 들어왔다고 해서 바로 끄지 않고 끝날때까지 대기

on:
  push: # push 이벤트가 발생했을 때 실행
    paths: # 아래 경로에서 변경이 있을 때만 실행
      - ".github/workflows/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "Dockerfile"
    branches: # develop 브랜치에 push될 때만 실행
      - develop
  workflow_dispatch: # 깃허브 Actions에서 수동으로 워크플로우 실행 가능

# 이 워크플로우가 가지는 권한 설정
permissions:
  contents: write # 태그/릴리즈 생성에 필요한 쓰기 권한
  packages: write # GHCR에 도커 이미지 푸시할 때 필요한 쓰기 권한

# 기본 셸
defaults:
  run:
    shell: bash

jobs: # 실제 작업 시작
  # 1) 태그/릴리즈 자동 생성
  makeTagAndRelease:
    runs-on: ubuntu-latest # ubuntu 가상 환경에서 실행됨
    outputs:
      tag_name: ${{ steps.create_tag.outputs.new_tag }} # 이후 잡에서 사용할 태그명
    steps:
      - uses: actions/checkout@v4 # 코드를 runner로 가져옴

      # 버전 태그 자동 생성 (vX.Y.Z)
      - name: Create Tag
        id: create_tag
        uses: mathieudutour/github-tag-action@v6.2 # 자동으로 버전을 올려서 태그를 생성하는 액션
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈 생성
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1 # 위에서 만든 태그를 기반으로 릴리즈 생성하는 액션
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          release_name: Release ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          draft: false
          prerelease: false

  # 2) 도커 이미지 빌드 및 푸시
  buildImageAndPush:
    name: 도커 이미지 빌드와 푸시
    needs: makeTagAndRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 컨텍스트에 .env 생성 (비어있어도 실패하지 않게)
      - name: .env 파일 생성
        env:
          DOT_ENV: ${{ secrets.DOT_ENV }}
        run: |
          # .env가 없으면 빌드 캐시가 매번 깨질 수 있으므로 항상 생성
          mkdir -p "${{ env.BACKEND_DIR }}"
          printf "%s" "${DOT_ENV}" > "${{ env.BACKEND_DIR }}/.env"

      # GA4 서비스 계정 파일 생성
      - name: Create GA4 Service Account Key
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.GA4_JSON }}" | base64 -d > src/main/resources/ga4-service-account.json

      - name: Docker Buildx 설치
        uses: docker/setup-buildx-action@v3 # 도커 이미지를 더 효율적으로 빌드할 수 있는 Buildx를 설정

      # GHCR에 로그인
      - name: 레지스트리 로그인
        uses: docker/login-action@v3 # GHCR 로그인
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 저장소 소유자명을 소문자로 (GHCR 경로 표준화)
      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_ENV}"
        env:
          OWNER: "${{ github.repository_owner }}"

      # 캐시를 최대한 활용하여 빌드 → 버전 태그 및 latest 동시 푸시
      - name: 빌드 앤 푸시
        uses: docker/build-push-action@v6 # 이미지를 빌드하고 푸시하는 단계
        with:
          context: ${{ env.BACKEND_DIR }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max # 빌드 캐시를 사용하여 다음 빌드 시간을 단축
          tags: | # 이미지에 버전 태그와 latest 태그 2개를 붙여서 푸시
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:${{ needs.makeTagAndRelease.outputs.tag_name }}
            ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_REPOSITORY }}:latest 

  # 3) Blue/Green 무중단 배포 (EC2 + NPM 스위치)
  deploy:
    name: Blue/Green 무중단 배포
    runs-on: ubuntu-latest
    needs: [makeTagAndRelease, buildImageAndPush]
    steps:
      # AWS 자격 구성
      - uses: aws-actions/configure-aws-credentials@v4 # SSH 대신 SSM을 사용하여 EC2 인스턴스에 원격으로 아래의 command 스크립트를 실행함
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Name 태그로 EC2 인스턴스 조회 (없으면 실패)
      - name: 인스턴스 ID 가져오기
        id: get_instance_id
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.EC2_INSTANCE_TAG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          [[ -n "${INSTANCE_ID}" && "${INSTANCE_ID}" != "None" ]] || { echo "No running instance found"; exit 1; }
          echo "INSTANCE_ID=${INSTANCE_ID}" >> "${GITHUB_ENV}"

      # 원격(SSM)으로 Blue/Green 스위치 수행
      - name: AWS SSM Send-Command
        uses: peterkimzz/aws-ssm-send-command@master
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          instance-ids: ${{ env.INSTANCE_ID }}
          working-directory: /
          comment: Deploy
          command: |
            set -Eeuo pipefail

            # ---------------------------------------------------------
            # 0) 실행 로그 (스크립트의 실행 결과를 타임스탬프와 함께 /tmp 폴더에 로그 파일로 저장하고 화면에 출력)
            # ---------------------------------------------------------
            LOG="/tmp/ssm-$(date +%Y%m%d_%H%M%S).log"
            exec > >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG")
            exec 2> >(awk '{ fflush(); print strftime("[%Y-%m-%d %H:%M:%S]"), $0 }' | tee -a "$LOG" >&2)
            
            # ---------------------------------------------------------
            # 1) 변수 정의
            # ---------------------------------------------------------
            source /etc/environment || true   # EC2 인스턴스의 /ect/environment 파일에 저장된 환경변수를 불러옴
            OWNER_LC="${{ github.repository_owner }}"
            OWNER_LC="${OWNER_LC,,}" 
            IMAGE_TAG="${{ needs.makeTagAndRelease.outputs.tag_name }}"
            IMAGE_REPOSITORY="${{ env.IMAGE_REPOSITORY }}"
            IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" # 도커 이미지의 전체 경로 생성. 
            SLOT1="${{ env.CONTAINER_1_NAME }}"
            SLOT2="${{ env.CONTAINER_2_NAME }}"
            PORT_IN="${{ env.CONTAINER_PORT }}"
            NET="${{ env.DOCKER_NETWORK }}"

            echo "🔹 Use image: ${IMAGE}" # 이번 배포에서 사용할 이미지의 버전을 로그로 출력
            docker pull "${IMAGE}" # 이미지 경로를 사용해서 GHCR에서 최신 버전의 애플리케이션 이미지를 EC2 인스턴스로 pull 받음

            # ---------------------------------------------------------
            # 2) Nginx Proxy Manager(NPM) API 토큰 발급
            # ---------------------------------------------------------
            TOKEN=$(curl -s -X POST http://127.0.0.1:81/api/tokens \
              -H "Content-Type: application/json" \
              -d "{\"identity\": \"admin@npm.com\", \"secret\": \"${PASSWORD:-}\"}" | jq -r '.token')

            # 토큰/도메인 검증(없으면 실패)
            [[ -n "${TOKEN}" && "${TOKEN}" != "null" ]] || { echo "NPM token issue failed"; exit 1; }
            [[ -n "${APP_DOMAIN:-}" ]] || { echo "APP_DOMAIN is empty"; exit 1; }

            # 대상 프록시 호스트 ID 조회(도메인 매칭)
            PROXY_ID=$(curl -s -X GET "http://127.0.0.1:81/api/nginx/proxy-hosts" \
              -H "Authorization: Bearer ${TOKEN}" \ 
              | jq ".[] | select(.domain_names[]==\"${APP_DOMAIN}\") | .id") 

            [[ -n "${PROXY_ID}" && "${PROXY_ID}" != "null" ]] || { echo "Proxy host not found for ${APP_DOMAIN}"; exit 1; }

            # 현재 프록시가 바라보는 업스트림(컨테이너명) 조회
            CURRENT_HOST=$(curl -s -X GET "http://127.0.0.1:81/api/nginx/proxy-hosts/${PROXY_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              | jq -r '.forward_host')
            
            # 찾아낸 현재 운영 중인 컨테이너 이름을 로그로 출력
            echo "🔎 CURRENT_HOST: ${CURRENT_HOST:-none}" 
            
            # ---------------------------------------------------------
            # 3) 역할(blue/green) 판정
            #    - blue : 현재 운영 중인 컨테이너
            #    - green: 새로 배포할 컨테이너
            # ---------------------------------------------------------
            if [[ "${CURRENT_HOST:-}" == "${SLOT1}" ]]; then
              BLUE="${SLOT1}"
              GREEN="${SLOT2}"
            elif [[ "${CURRENT_HOST:-}" == "${SLOT2}" ]]; then
              BLUE="${SLOT2}"
              GREEN="${SLOT1}"
            else
              BLUE="none"   # 초기 배포
              GREEN="${SLOT1}"
            fi
            echo "🎨 role -> blue(now): ${BLUE}, green(next): ${GREEN}" # 결정된 역할을 로그로 출력

            # ---------------------------------------------------------
            # 4) green 역할 컨테이너 재기동
            # ---------------------------------------------------------
            docker rm -f "${GREEN}" >/dev/null 2>&1 || true
            echo "🚀 run new container → ${GREEN}"
            docker run -d --name "${GREEN}" \
              --restart unless-stopped \
              --network "${NET}" \
              -e TZ=Asia/Seoul \
              "${IMAGE}"
            
            # ---------------------------------------------------------
            # 5) 헬스체크
            # ---------------------------------------------------------
            echo "⏱ health-check: ${GREEN}"
            TIMEOUT=120 # 120초 안에 정상 상태가 되지 않으면 실패로 간주하여 새로 띄운 컨테이너 삭제하고 스크립트 중단 
            INTERVAL=3
            ELAPSED=0
            sleep 8  # 초기 부팅 여유

            while (( ELAPSED < TIMEOUT )); do
              CODE=$(docker exec "${GREEN}" curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT_IN}/actuator/health" || echo 000)
              [[ "${CODE}" == "200" ]] && { echo "✅ ${GREEN} healthy"; break; }
              sleep "${INTERVAL}"
              ELAPSED=$((ELAPSED + INTERVAL))
            done
            [[ "${CODE:-000}" == "200" ]] || { echo "❌ ${GREEN} health failed"; docker logs --tail=200 "${GREEN}" || true; docker rm -f "${GREEN}" || true; exit 1; }

            # ---------------------------------------------------------
            # 6) 업스트림 전환
            # ---------------------------------------------------------
            NEW_CFG=$(jq -n --arg host "${GREEN}" --argjson port ${PORT_IN} '{forward_host:$host, forward_port:$port}')
            curl -s -X PUT "http://127.0.0.1:81/api/nginx/proxy-hosts/${PROXY_ID}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${NEW_CFG}" >/dev/null
            echo "🔁 switch upstream → ${GREEN}:${PORT_IN}"

            # ---------------------------------------------------------
            # 7) 이전 blue 종료 (최초 배포면 생략)
            # ---------------------------------------------------------
            if [[ "${BLUE}" != "none" ]]; then 
              docker stop "${BLUE}" >/dev/null 2>&1 || true
              docker rm "${BLUE}" >/dev/null 2>&1 || true
              echo "🧹 removed old blue: ${BLUE}"
            fi

            # ---------------------------------------------------------
            # 8) 이미지 정리
            # ---------------------------------------------------------
            {
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep -F "ghcr.io/${OWNER_LC}/${IMAGE_REPOSITORY}:" \
                | grep -v -F ":${IMAGE_TAG}" \
                | grep -v -F ":latest" \
                | xargs -r docker rmi
            } || true
            
            # 모든 과정이 성공적으로 완료됐음을 나타내는 메시지
            echo "🏁 Blue/Green switch complete. now blue = ${GREEN}"