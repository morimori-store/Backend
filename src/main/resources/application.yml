server:
  port: 8080
  forward-headers-strategy: native
  # Post body 크기 100MB 설정
  tomcat:
    max-http-form-post-size: 100MB
spring:
  # redis가 개발/테스트 환경에서 작동하지 않도록 설정
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
  application:
    name: back
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  datasource:
    hikari:
      auto-commit: false
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    # osiv 끄기
    open-in-view: false
  decorator:
    datasource:
      p6spy:
        enable-logging: true
  task:
    scheduling:
      pool:
        size: 5  # 스케줄러 스레드 풀 크기
      thread-name-prefix: funding-scheduler-
  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-secret}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - name
              - email
              - profile_image
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
  # Gmail SMTP 설정
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8
  # 파일 업로드 용량 설정
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Frontend URL (OAuth2 리다이렉트용, UTM 링크 생성용)
app:
  cookie:
    secure: false
    domain: localhost
  frontend-url: http://localhost:3000

# JWT 설정 (.env 파일 없어도 동작하도록 기본값 제공)
jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}    # 1시간
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7일

springdoc:
  default-produces-media-type: application/json;charset=UTF-8

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
    com.back: DEBUG

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
    probes:
      enabled: true
    show-details: never

# 도메인 설정
custom:
  dev: #개발환경에서
    cookieDomain: localhost
    frontUrl: "http://${custom.dev.cookieDomain}:3000" #localhost:3000
    backUrl: "http://${custom.dev.cookieDomain}:${server.port}" #localhost:8080
  prod: #운영환경에서
    cookieDomain: mori-mori.store
    frontUrl: "https://www.${custom.prod.cookieDomain}" #https://www.mori-mori.store
    backUrl: "https://api.${custom.prod.cookieDomain}" #https://api.mori-mori.store
  site: #기본적으로 개발 환경 도메인 활성화
    cookieDomain: "${custom.dev.cookieDomain}" #localhost
    frontUrl: "${custom.dev.frontUrl}" #localhost:3000
    backUrl: "${custom.dev.backUrl}" #localhost:8080
    name: mori-mori

# AWS S3 설정
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${AWS_S3_BUCKET}
    stack:
      auto: false

# Google Analytics 4 설정
google:
  analytics:
    property-id: properties/1223286596
    credentials-path: classpath:ga4-service-account.json

# OpenAI 설정
openai:
  api-key: ${OPENAI_API_KEY:}
# 결제 PG 설정 (PortOne + 토스페이먼츠)
payment:
  portone:
    imp-key: ${PORTONE_IMP_KEY:test-imp-key}
    imp-secret: ${PORTONE_IMP_SECRET:test-imp-secret}
  toss:
    api-url: ${TOSS_API_URL:https://api.tosspayments.com/v2}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:test-webhook-secret}

