spring:
  autoconfigure:
    exclude:
  data:
    redis:
      host: ${REDIS_HOST}
#      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
#    elasticsearch:
#      client:
#        endpoints: ${ELASTICSEARCH_HOST:elasticsearch:9200}
#        username: ${ELASTICSEARCH_USERNAME}
#        password: ${ELASTICSEARCH_PASSWORD}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  analytics:
    google:
      analytics:
        credentials-path: classpath:ga4-service-account.json

logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.orm.jdbc.extract: INFO
    org.springframework.transaction.interceptor: INFO
    com.back: INFO
custom:
  site:
    cookieDomain: "${custom.prod.cookieDomain}"
    frontUrl: "${custom.prod.frontUrl}"
    backUrl: "${custom.prod.backUrl}"
    name: mori-mori

# Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  health:
    mail:
      enabled: false
    probes:
      enabled: true
    show-details: never

# https 설정
app:
  cookie:
    secure: true
    domain: .mori-mori.store
  frontend-url: https://www.mori-mori.store